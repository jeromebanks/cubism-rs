[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "cubism"
version = "0.1.0"
description = "Declarative multidimensional aggregation with mergeable sketches"
requires-python = ">=3.9"
dependencies = ["pyarrow>=14"]
license = { text = "Apache-2.0" }

[tool.maturin]
module-name = "cubism"
