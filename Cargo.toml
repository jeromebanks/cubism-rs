[workspace]
resolver = "3"
members = [
    "crates/cubism-core",
    "crates/cubism-datafusion",
    "crates/cubism-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jeromebanks/cubism-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"
