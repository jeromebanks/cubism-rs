[package]
name = "cubism-core"
description = "Core cube algebra: XUnit/YPath model, filter rules, lattice generation, spec types, and mergeable sketch aggregators"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = "1"
# Payload checksum for aggregate-state blob framing (issue #9). Already in
# the dependency graph transitively (via the Parquet/Arrow stack); named
# here because cubism-core uses it directly.
crc32fast = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = "0.9"
thiserror = { workspace = true }
xxhash-rust = { version = "0.8.16", features = ["xxh3"] }

[dev-dependencies]
proptest = { workspace = true }
