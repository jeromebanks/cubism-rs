[package]
name = "cubism-datafusion"
description = "DataFusion execution for Cubism: XUnit explode operator and sketch UDAFs (M2)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cubism-core = { path = "../cubism-core" }
datafusion = "54.0.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_json.workspace = true

[dev-dependencies]
proptest = { workspace = true }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
cubism-iceberg = { path = "../cubism-iceberg" }
tempfile = "3"
# DataFusion dependency lands in M2 with the XUnitExplode stream adapter.
# cubism-iceberg is a dev-dependency only (Milestone 7 spike test), not a
# regular dependency: nothing in src/ touches it until Milestone 10. See
# docs/TIMESERIES_ROADMAP.md's Milestone 7.
