[package]
name = "cubism-cli"
description = "Cubism command-line interface: run cube specs against local data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cubism"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
cubism-core = { path = "../cubism-core" }
cubism-datafusion = { path = "../cubism-datafusion" }
cubism-serve = { path = "../cubism-serve" }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
