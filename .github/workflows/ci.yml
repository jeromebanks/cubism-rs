name: CI

# Required pre-merge gate for #43: every PR into main, and every push to
# main (post-merge signal), runs fmt/clippy/test/docs against the pinned
# toolchain in rust-toolchain.toml, example-spec validation, an internal
# markdown link check, and a build+import smoke test for the Python
# bindings. See docs/sdlc-process-notes.md for why fmt/docs are gated
# with warnings-as-errors from the start rather than added loose and
# tightened later.
#
# Slow/optional suites (cargo-deny, the Scala Spark adapter, benchmark
# regressions) live in nightly.yml instead, so this file stays fast enough
# to be a required check on every PR.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Single source of truth for the pinned version used *in CI*; keep in
  # sync with rust-toolchain.toml's channel (that file is what local
  # `cargo`/`rustup` pick up automatically — dtolnay/rust-toolchain does
  # not read it and requires an explicit `toolchain` input).
  RUST_TOOLCHAIN: "1.96.1"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      # --all-targets excludes doctests (a cargo limitation, not a typo);
      # run them as a separate step so a broken doc example still fails CI.
      - run: cargo test --workspace --doc

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"

  spec-validate:
    name: spec validation (examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p cubism-cli
      - name: validate every example cube spec
        run: |
          set -euo pipefail
          shopt -s nullglob
          specs=(examples/*.yaml examples/web_analytics_demo/*.yaml)
          for spec in "${specs[@]}"; do
            echo "== $spec =="
            ./target/debug/cubism validate "$spec"
          done

  links:
    name: link check (internal, README + docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lychee (offline — internal/relative links + fragments only)
        uses: lycheeverse/lychee-action@v2
        with:
          # --offline: never hits the network, so this stays fast and
          # deterministic enough to be a required check (external-link
          # rot goes to nightly.yml instead, per #43's remediation
          # pattern in deny.toml). --include-fragments catches broken
          # in-page section links like docs/TIMESERIES_ROADMAP.md's.
          args: >-
            --offline --include-fragments --no-progress
            README.md 'docs/**/*.md'
          fail: true

  python:
    name: python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "maturin>=1.7,<2" pyarrow
      # No pytest suite exists yet for bindings/cubism-py (tracked under
      # #43's remaining workstreams) — this is a build + import smoke test,
      # not a claim that the bindings have behavioral test coverage.
      - name: maturin build
        working-directory: bindings/cubism-py
        run: maturin build --out dist
      - run: pip install --no-index --find-links bindings/cubism-py/dist cubism
      - run: python -c "import cubism; print(cubism.__file__)"

  # Single required status check for branch protection, so the protected-
  # branch rule doesn't need updating every time a job above is added,
  # renamed, or split.
  ci-required:
    name: CI required checks
    if: always()
    needs: [fmt, clippy, test, docs, spec-validate, links, python]
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs succeeded
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [ "$result" != "success" ]; then
              echo "at least one required job did not succeed: ${{ join(needs.*.result, ', ') }}"
              exit 1
            fi
          done
